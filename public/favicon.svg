<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Royal Maroon Gradient -->
    <radialGradient id="bgMaroon" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8C2222" />
      <stop offset="100%" stop-color="#4A0E17" />
    </radialGradient>

    <!-- Gold Mukut Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE680" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996F26" />
    </linearGradient>

    <!-- Ear Blush Pink -->
    <radialGradient id="earBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB5BA" />
      <stop offset="100%" stop-color="#FCD5CE" />
    </radialGradient>
  </defs>

  <!-- Circular Outer Badge with Gold Border -->
  <circle cx="64" cy="64" r="60" fill="url(#bgMaroon)" stroke="#D4AF37" stroke-width="4" />

  <!-- Outer Aura Glow -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(212, 175, 55, 0.3)" stroke-width="2" stroke-dasharray="4 3" />

  <!-- Cute Big Ears (Left & Right) -->
  <path d="M 38 68 C 12 66, 14 42, 38 48 Z" fill="#FFE5D9" stroke="#996F26" stroke-width="2" />
  <path d="M 36 64 C 18 62, 20 46, 36 50 Z" fill="url(#earBlush)" />

  <path d="M 90 68 C 116 66, 114 42, 90 48 Z" fill="#FFE5D9" stroke="#996F26" stroke-width="2" />
  <path d="M 92 64 C 110 62, 108 46, 92 50 Z" fill="url(#earBlush)" />

  <!-- Cute Chubby Head -->
  <ellipse cx="64" cy="66" rx="28" ry="26" fill="#FFE5D9" stroke="#996F26" stroke-width="2" />

  <!-- Golden Mukut (Crown) -->
  <path d="M 44 48 Q 64 36 84 48 L 80 34 Q 64 22 48 34 Z" fill="url(#goldGrad)" stroke="#996F26" stroke-width="1.5" />
  <!-- Crown Top Peak & Jewel -->
  <polygon points="64,12 56,26 72,26" fill="url(#goldGrad)" stroke="#996F26" stroke-width="1.5" />
  <circle cx="64" cy="20" r="3" fill="#E63946" stroke="#996F26" stroke-width="0.8" />
  <circle cx="64" cy="40" r="3.5" fill="#E63946" />

  <!-- Cute Big Expressive Eyes -->
  <!-- Left Eye -->
  <ellipse cx="52" cy="58" rx="4.5" ry="5.5" fill="#2B1810" />
  <circle cx="50.5" cy="56" r="1.8" fill="#FFFFFF" />
  <circle cx="53" cy="60" r="0.8" fill="#FFFFFF" />
  <path d="M 47 52 Q 52 49 57 52" fill="none" stroke="#663300" stroke-width="1.5" stroke-linecap="round" />

  <!-- Right Eye -->
  <ellipse cx="76" cy="58" rx="4.5" ry="5.5" fill="#2B1810" />
  <circle cx="74.5" cy="56" r="1.8" fill="#FFFFFF" />
  <circle cx="77" cy="60" r="0.8" fill="#FFFFFF" />
  <path d="M 71 52 Q 76 49 81 52" fill="none" stroke="#663300" stroke-width="1.5" stroke-linecap="round" />

  <!-- Red & Gold Sacred Tilak on Forehead -->
  <path d="M 60 44 Q 64 42 68 44" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" />
  <path d="M 59 47 Q 64 45 69 47" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" />
  <circle cx="64" cy="45.5" r="2" fill="#D90429" />

  <!-- Cute Little Trunk with Happy Curl holding Modak -->
  <path d="M 60 66 Q 59 78 68 84 Q 78 88 84 80 Q 86 74 81 72 Q 75 72 75 77" fill="#FFE5D9" stroke="#996F26" stroke-width="2" stroke-linecap="round" />

  <!-- Little Golden Modak on Trunk Tip -->
  <path d="M 79 72 Q 85 64 89 72 Q 89 78 84 80 Q 79 78 79 72 Z" fill="url(#goldGrad)" stroke="#996F26" stroke-width="1.2" />

  <!-- Rosy Cute Cheeks -->
  <ellipse cx="44" cy="66" rx="4" ry="2.5" fill="#FF8FAB" opacity="0.6" />
  <ellipse cx="84" cy="66" rx="4" ry="2.5" fill="#FF8FAB" opacity="0.6" />

  <!-- Small Cute Tusk -->
  <polygon points="49,69 47,75 52,71" fill="#FFFFFF" stroke="#996F26" stroke-width="0.8" />
</svg>
