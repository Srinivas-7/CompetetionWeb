<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Neon Magenta -> Sunset Orange -> Electric Lime -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="50%" stop-color="#ff5500" />
      <stop offset="100%" stop-color="#ccff00" />
    </linearGradient>

    <!-- Electric Yellow Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fffb00" />
      <stop offset="100%" stop-color="#ffb700" />
    </linearGradient>

    <!-- Filter for subtle drop shadow on the bolt -->
    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 1. Neon Pink 3D Offset Shadow Block -->
  <rect x="18" y="18" width="96" height="96" rx="26" fill="#ff007f" />

  <!-- 2. Main Gradient Badge with White Border -->
  <rect x="10" y="10" width="96" height="96" rx="26" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="5" />

  <!-- 3. High-Contrast Electric Yellow Thunderbolt -->
  <path 
    d="M62 26 L42 66 L56 66 L48 98 L76 56 L60 56 Z" 
    fill="url(#boltGrad)" 
    stroke="#000000" 
    stroke-width="2" 
    stroke-linejoin="round"
    filter="url(#boltGlow)"
  />
</svg>
